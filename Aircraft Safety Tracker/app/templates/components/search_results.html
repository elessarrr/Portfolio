{% if grouped_results %}
<div class="bg-white rounded-md shadow-lg border border-gray-200 overflow-hidden max-h-[60vh] overflow-y-auto">
    {% for series, aircraft_list in grouped_results.items() %}
    <div class="border-b last:border-b-0 border-gray-100">
        <!-- Series Header -->
        <div class="px-4 py-2 bg-gray-50 text-xs font-semibold text-gray-500 uppercase tracking-wider sticky top-0">
            {{ series }} Series
        </div>
        
        <!-- Models in this Series -->
        <ul>
            {% for aircraft in aircraft_list %}
            <li class="border-t border-gray-50 first:border-t-0 hover:bg-blue-50 transition">
                <a href="{{ url_for('main.aircraft_details', aircraft_id=aircraft.id) }}" class="block px-6 py-3">
                    <div class="flex justify-between items-center">
                        <span class="font-medium text-gray-900">{{ aircraft.model_name }}</span>
                        <!-- Arrow Icon -->
                        <svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
                        </svg>
                    </div>
                </a>
            </li>
            {% endfor %}
        </ul>
    </div>
    {% endfor %}
</div>
{% else %}
<div class="bg-white p-4 rounded-md shadow text-center text-gray-500">
    No aircraft found matching "{{ request.args.get('q') }}"
</div>
{% endif %}
