{% extends "base.html" %}

{% block content %}
<div class="flex flex-col items-center justify-center min-h-[60vh]">
    <h1 class="text-4xl font-bold mb-8 text-primary">Aircraft Safety Tracker</h1>
    
    <div class="w-full max-w-2xl">
        <div class="relative">
            <input type="text" 
                   name="q" 
                   class="w-full px-6 py-4 rounded-full border-2 border-gray-300 focus:border-primary focus:outline-none text-lg shadow-sm"
                   placeholder="Search for an aircraft (e.g., Boeing 737 MAX, Airbus A320)..."
                   hx-get="/search" 
                   hx-trigger="keyup changed delay:500ms, search" 
                   hx-target="#search-results" 
                   hx-indicator="#loading">
            
            <div class="absolute right-4 top-4 text-gray-400">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                </svg>
            </div>
        </div>
        
        <div id="loading" class="htmx-indicator flex justify-center mt-4">
            <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-primary"></div>
        </div>
        
        <div id="search-results" class="mt-4 w-full">
            <!-- Results will appear here -->
        </div>
    </div>
</div>
{% endblock %}
