{% extends "base.html" %}

{% block title %}Incidents Database - Aircraft Safety Tracker{% endblock %}

{% block content %}
<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <h1 class="text-3xl font-bold text-gray-900 mb-8">Incidents Database</h1>
    
    <div class="flex flex-col md:flex-row gap-8">
        <!-- Sidebar / Filters -->
        <div class="w-full md:w-64 flex-shrink-0">
            <!-- Filter form will go here in Task 4.0 -->
            <form id="filter-form" hx-get="/incidents" hx-target="body" hx-push-url="true">
                <input type="hidden" name="placeholder" value="1">
            </form>
        </div>

        <!-- Main Content -->
        <div class="flex-1">
            <div id="incident-container">
                {% include "components/global_incident_list.html" with context %}
            </div>
        </div>
    </div>
</div>
{% endblock %}
