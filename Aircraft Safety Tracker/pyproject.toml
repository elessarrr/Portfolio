[tool.ruff]
line-length = 100
target-version = "py38"
exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.8"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
exclude = ["migrations/"]

[[tool.mypy.overrides]]
module = ["app.models"]
ignore_errors = true
