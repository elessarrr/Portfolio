{% extends "base.html" %}

{% block sidebar %}
<div class="space-y-4">
    <h2 class="text-sm font-semibold text-gray-900 uppercase tracking-wide">Quick Filters</h2>
    <div class="space-y-2">
        <button type="button" data-query-shortcut="Boeing" class="w-full text-left px-3 py-2 text-sm bg-gray-50 rounded border border-gray-200 hover:bg-gray-100">Boeing</button>
        <button type="button" data-query-shortcut="Airbus" class="w-full text-left px-3 py-2 text-sm bg-gray-50 rounded border border-gray-200 hover:bg-gray-100">Airbus</button>
        <button type="button" data-query-shortcut="737" class="w-full text-left px-3 py-2 text-sm bg-gray-50 rounded border border-gray-200 hover:bg-gray-100">737 family</button>
        <button type="button" data-query-shortcut="A320" class="w-full text-left px-3 py-2 text-sm bg-gray-50 rounded border border-gray-200 hover:bg-gray-100">A320 family</button>
    </div>
</div>
{% endblock %}

{% block content %}
<div class="flex flex-col items-center justify-center min-h-[60vh]" data-enable-sidebar="true">
    <h1 class="text-4xl font-bold mb-8 text-primary">Aircraft Safety Tracker</h1>
    
    <div class="w-full max-w-2xl">
        <div class="relative">
            <input type="text" 
                   id="search-query-input"
                   name="q" 
                   class="w-full px-6 py-4 rounded-full border-2 border-gray-300 focus:border-primary focus:outline-none text-lg shadow-sm"
                   placeholder="Search for an aircraft (e.g., Boeing 737 MAX, Airbus A320)..."
                   hx-get="/search" 
                   hx-trigger="keyup changed delay:500ms, search" 
                   hx-target="#search-results" 
                   hx-indicator="#htmx-global-indicator">
            
            <div class="absolute right-4 top-4 text-gray-400">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                </svg>
            </div>
        </div>
        
        <div id="loading" class="htmx-indicator flex justify-center mt-4">
            <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-primary"></div>
        </div>
        
        <div id="search-results" class="mt-4 w-full">
            <!-- Results will appear here -->
        </div>
    </div>
</div>
{% endblock %}
