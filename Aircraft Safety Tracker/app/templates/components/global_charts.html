{% if chart_data %}
<div {% if request.headers.get('HX-Request') %}hx-swap-oob="true"{% endif %} class="dashboard-charts mb-8">
    
    <!-- Timeline Chart -->
    <div class="bg-white p-4 rounded-lg shadow-sm border border-gray-200">
        <h3 class="text-sm font-semibold text-gray-700 mb-4">Incidents Over Time</h3>
        <div class="relative h-64">
            <canvas id="timelineChart"></canvas>
        </div>
    </div>

    <!-- Severity Chart -->
    <div class="bg-white p-4 rounded-lg shadow-sm border border-gray-200">
        <h3 class="text-sm font-semibold text-gray-700 mb-4">Severity Breakdown</h3>
        <div class="relative h-64">
            <canvas id="severityChart"></canvas>
        </div>
    </div>

    <!-- Manufacturer Chart -->
    <div class="bg-white p-4 rounded-lg shadow-sm border border-gray-200">
        <h3 class="text-sm font-semibold text-gray-700 mb-4">Incidents by Manufacturer</h3>
        <div class="relative h-64">
            <canvas id="mfgChart"></canvas>
        </div>
    </div>

    <script>
        (function() {
            // Destroy existing chart instances if they exist to prevent canvas reuse errors
            if (window.timelineChartInst) window.timelineChartInst.destroy();
            if (window.severityChartInst) window.severityChartInst.destroy();
            if (window.mfgChartInst) window.mfgChartInst.destroy();

            const chartDataStr = '{{ chart_data | tojson | safe }}';
            const chartData = JSON.parse(chartDataStr);
            
            // 1. Timeline Trends
            const ctxTimeline = document.getElementById('timelineChart').getContext('2d');
            window.timelineChartInst = new Chart(ctxTimeline, {
                type: 'line',
                data: {
                    labels: Object.keys(chartData.timeline),
                    datasets: [{
                        label: 'Incidents',
                        data: Object.values(chartData.timeline),
                        borderColor: '#1e3a8a',
                        backgroundColor: 'rgba(30, 58, 138, 0.1)',
                        borderWidth: 2,
                        fill: true,
                        tension: 0.3
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: { y: { beginAtZero: true, ticks: { precision: 0 } } }
                }
            });

            // 2. Severity Breakdown
            const ctxSeverity = document.getElementById('severityChart').getContext('2d');
            window.severityChartInst = new Chart(ctxSeverity, {
                type: 'doughnut',
                data: {
                    labels: ['Fatal', 'Non-fatal'],
                    datasets: [{
                        data: [chartData.severity.fatal, chartData.severity.nonfatal],
                        backgroundColor: ['#dc2626', '#10b981'],
                        borderWidth: 0
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    cutout: '60%'
                }
            });

            // 3. Manufacturer Distribution
            const ctxMfg = document.getElementById('mfgChart').getContext('2d');
            window.mfgChartInst = new Chart(ctxMfg, {
                type: 'bar',
                data: {
                    labels: Object.keys(chartData.manufacturers),
                    datasets: [{
                        label: 'Incidents',
                        data: Object.values(chartData.manufacturers),
                        backgroundColor: '#f59e0b',
                        borderRadius: 4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: { y: { beginAtZero: true, ticks: { precision: 0 } } }
                }
            });
        })();
    </script>
</div>
{% endif %}
